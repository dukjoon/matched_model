name: Weekly Benchmark Update

on:
  schedule:
    # Runs every Monday at 03:00 UTC (12:00 KST)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraping,dev]"

      - name: Run benchmark update pipeline
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          matched-model update

      - name: Validate data & scoring tests
        run: |
          pytest tests/

      - name: Commit and push directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json data/routing_rules.json docs/data/benchmarks.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
          else
            git commit -m "chore(data): weekly benchmark update"
            git push origin main
          fi
