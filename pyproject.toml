[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matched-model"
version = "0.1.0"
description = "Multi-benchmark AI model aggregation, domain-aware re-ranking, and right-sizing ('적정기술') recommender + Agent Skill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
scraping = ["httpx>=0.27", "beautifulsoup4>=4.12"]
dev = ["pytest>=8.0"]

[project.scripts]
matched-model = "matched_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
